name: build-appx

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: build-appx-lumia-valley
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Baixar assets do cofre privado
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) {
            throw "Secret ASSETS_TOKEN nao configurado no repo LumiaValley"
          }

          $assetsRepo = "uaitibat/LumiaValley-assets"

          gh api "repos/$assetsRepo" --jq '.full_name + " private=" + (.private|tostring)'
          if ($LASTEXITCODE -ne 0) {
            throw "O token nao consegue acessar $assetsRepo. Conferir resource owner/repository access do PAT."
          }

          $zip = Join-Path $env:RUNNER_TEMP "Content.zip"
          gh api -H "Accept: application/vnd.github.raw" `
            "repos/$assetsRepo/contents/Content.zip" --output $zip
          if ($LASTEXITCODE -ne 0) { throw "Falha ao baixar Content.zip do cofre" }

          New-Item -ItemType Directory -Force Content | Out-Null
          Expand-Archive -Path $zip -DestinationPath Content -Force
          Write-Host "Assets extraidos: $((Get-ChildItem Content -Recurse -File).Count) arquivos"

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compilar Release ARM
        shell: pwsh
        run: |
          msbuild LumiaValley.sln /restore /m `
            /p:Configuration=Release `
            /p:Platform=ARM `
            /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=false `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=SideloadOnly

      - name: Assinar pacote com signtool
        shell: pwsh
        run: |
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $signtool = Get-ChildItem $kits -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe nao encontrado em $kits" }
          Write-Host "signtool: $($signtool.FullName)"

          $pfx = Join-Path $env:RUNNER_TEMP "lumia.pfx"
          $b64 = [IO.File]::ReadAllText("certs/ci-legacy.b64").Trim()
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($b64))

          $pkgs = @(Get-ChildItem -Recurse -File |
            Where-Object {
              $_.Extension -in '.appx', '.msix' -and
              $_.FullName -notmatch '\\obj\\' -and
              $_.FullName -notmatch '\\Dependencies\\' -and
              $_.BaseName -notmatch '^Microsoft\.'
            })
          foreach ($p in $pkgs) {
            & $signtool.FullName sign /fd SHA256 /f $pfx $p.FullName
            if ($LASTEXITCODE -ne 0) { throw "falha ao assinar $($p.Name)" }
            & $signtool.FullName verify /pa /v $p.FullName | Out-Null
            if ($LASTEXITCODE -ne 0) {
              Write-Host "AVISO: verify /pa falhou (cadeia self-signed) - assinatura aplicada"
              $global:LASTEXITCODE = 0
            } else { Write-Host "assinatura verificada: $($p.Name)" }
          }

      - name: Reunir pacote e dependencias
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $pkgs = @(Get-ChildItem -Recurse -File |
            Where-Object {
              $_.Extension -in '.appx', '.msix' -and
              $_.FullName -notmatch '\\obj\\' -and
              $_.FullName -notmatch '\\Dependencies\\'
            })
          if ($pkgs.Count -eq 0) { throw "Nenhum .appx gerado - veja o log do MSBuild." }
          foreach ($p in $pkgs) { Copy-Item $p.FullName out/ -Force }
          $deps = Get-ChildItem -Recurse -Directory -Filter Dependencies | Select-Object -First 1
          if ($deps) { Copy-Item $deps.FullName out/Dependencies -Recurse -Force }
          Get-ChildItem out -Recurse -File | ForEach-Object { Write-Host ("  " + $_.FullName) }

      - name: Publicar appx no cofre privado
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { throw "Secret ASSETS_TOKEN nao configurado" }

          $assetsRepo = "uaitibat/LumiaValley-assets"
          $tag = "latest"

          gh release delete $tag --yes -R $assetsRepo 2>$null
          if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0 }

          $assets = @(Get-ChildItem out -File | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw "Nenhum arquivo em out/ para publicar" }

          gh release create $tag -R $assetsRepo `
            --title "LumiaValley ARM (latest)" `
            --notes "Build automatico: $(git rev-parse --short HEAD)" `
            $assets
          if ($LASTEXITCODE -ne 0) { throw "falha ao publicar appx no cofre" }

          Write-Host "Appx publicado (privado): https://github.com/$assetsRepo/releases/tag/$tag"
